name: Update EPG guide

on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch: {}     # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rewrite script
        run: python3 rewrite_epg.py

      - name: Commit updated guide
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml review.csv unmatched.csv
          git diff --cached --quiet && echo "No changes" || git commit -m "Update EPG guide $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
