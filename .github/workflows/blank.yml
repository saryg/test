name: Test epgshare01 reachability
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try downloading epgshare01 UK file
        run: |
          curl -sSL -o test.xml.gz -w "HTTP status: %{http_code}\nBytes: %{size_download}\n" https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz
          ls -la test.xml.gz
          gunzip -c test.xml.gz | head -c 500
